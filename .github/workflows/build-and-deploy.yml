name: build-and-deploy

on:
  # Deploy on push to main — no schedule trigger. There is no live source
  # behind public/data/talent.json (see CLAUDE.md's "Ingestion" section);
  # it's a committed file, regenerated by hand with
  # `npm run import-talent-charts` whenever talent_charts/ gets a fresh
  # export, not fetched on a cadence. The old quantum/AI verticals' every-
  # 3-hour cron existed to poll live sources that no longer exist here.
  push:
    branches: [main]
  # Test + build (never deploy — see the `deploy` job's own `if:` guard)
  # on any PR targeting main, so a real regression is a failed check on
  # the PR itself, not something only discovered after it's already live.
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # src/lib/*.test.ts — pure-function unit tests (data transforms,
      # country resolution, CSV export). No jsdom/browser environment
      # configured, so this only covers logic that doesn't touch the DOM;
      # see CLAUDE.md's testing section for what's covered and what isn't.
      - name: Test
        run: npm test

      # public/data/talent.json is a normal committed file (see CLAUDE.md) —
      # this build reads it straight off the checkout, same as any other
      # static asset. No fetch/import step runs here.
      - name: Build
        run: npm run build
        env:
          GTM_BASE: /${{ github.event.repository.name }}/

      # tests/accessibility.spec.ts — a committed axe-core/Playwright
      # sweep of all 9 routes (see CLAUDE.md's "Accessibility" section for
      # the 6 real violation categories this caught and fixed by hand
      # 2026-07-29). GTM_BASE must match the Build step above — astro
      # preview serves dist/ under that same base path, not root, and a
      # mismatch here 404s every route rather than testing the wrong
      # thing quietly.
      - name: Accessibility (axe-core)
        run: npx playwright install --with-deps chromium && npm run test:a11y
        env:
          GTM_BASE: /${{ github.event.repository.name }}/

      # tests/interaction.spec.ts — real keyboard-operation and
      # download-menu checks the automated axe-core sweep above can't
      # catch (axe only flags markup patterns, not whether Tab actually
      # reaches something or a download button produces a real file).
      # This is exactly how a real, serious keyboard-trap bug in
      # NewsTicker.tsx was caught and fixed 2026-07-30 — see CLAUDE.md's
      # "Interaction, accessibility, and visual-regression tests" section.
      - name: Interaction tests (Playwright)
        run: npm run test:interaction
        env:
          GTM_BASE: /${{ github.event.repository.name }}/

      # tests/visual-regression.spec.ts — a small, deliberately scoped set
      # of pixel-diff snapshots (one representative panel per real
      # ChartKind, not all 91 exhibits). continue-on-error is intentional
      # and permanent, not a bootstrapping shortcut: Playwright's
      # toHaveScreenshot() baselines are prone to cross-machine flakiness
      # even when generated on the same OS (font package drift between
      # separate ubuntu-latest runs over time), so a diff here is a
      # visible signal worth a human look, not a hard gate that blocks a
      # real, unrelated deploy. Baselines are generated by the separate
      # visual-baseline.yml workflow (run by hand on ubuntu-latest, the
      # same runner this step itself uses), never captured from a
      # contributor's own machine.
      - name: Visual regression (Playwright, non-blocking)
        id: visual_regression
        run: npm run test:visual
        continue-on-error: true
        env:
          GTM_BASE: /${{ github.event.repository.name }}/

      # continue-on-error above masks the step's own conclusion to
      # "success" so it never fails the job — checking .outcome (the
      # unmasked, real result) rather than the job-level failure() here,
      # since that would never fire otherwise. A real diff (or, the first
      # time this ever runs on a given OS, a missing-baseline "writing
      # actual" case) is otherwise invisible — the step above only reports
      # pass/fail text, not the images themselves. Uploading test-results/
      # lets a maintainer download the actual/expected/diff PNGs straight
      # from the Actions run to decide whether a change is real or needs a
      # new baseline (via visual-baseline.yml), without re-running
      # anything locally.
      - uses: actions/upload-artifact@v4
        if: steps.visual_regression.outcome == 'failure'
        with:
          name: visual-regression-failure-output
          path: test-results/
          retention-days: 14

      # scripts/generate-downloads.ts — build-time PNG chart images and
      # per-stage ZIP CSV bundles (see CLAUDE.md's "Per-chart downloads"
      # section), only needed on a real deploy, not a PR status check —
      # Playwright's already installed from the a11y step above, so this
      # doesn't pay that cost twice. Writes into dist/downloads/, which
      # the artifact upload right after this picks up along with
      # everything else astro build produced.
      - name: Generate downloadable PNGs and ZIPs
        if: github.event_name == 'push'
        run: npm run generate-downloads
        env:
          GTM_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    needs: build
    # Only a push to main deploys — a pull_request run stops after
    # test+build above, as a status check on the PR, never touching the
    # live site.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
