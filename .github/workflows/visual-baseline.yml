name: visual-baseline

# Manual-only. tests/visual-regression.spec.ts's own baseline PNGs
# (tests/visual-regression.spec.ts-snapshots/) must be generated on the
# same OS/font stack they're later compared against — Playwright
# screenshots differ by a few pixels of anti-aliasing across macOS vs.
# Linux even with an identical Chromium build, and this repo's real CI
# (build-and-deploy.yml) runs on ubuntu-latest, not a contributor's own
# machine. Run this by hand (Actions tab -> visual-baseline -> Run
# workflow, or `gh workflow run visual-baseline.yml`) whenever a real,
# intentional visual change needs new baselines; download the
# `visual-baseline-snapshots` artifact this produces and commit its
# contents over the existing snapshot directory.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GTM_BASE: /${{ github.event.repository.name }}/

      - run: npx playwright install --with-deps chromium

      - name: Generate visual-regression baselines
        run: npx playwright test tests/visual-regression.spec.ts --update-snapshots
        env:
          GTM_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-snapshots
          path: tests/visual-regression.spec.ts-snapshots/
